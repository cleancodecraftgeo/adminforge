

# services:

#     redis:
#         image: redis:7

services:

    app:
        build:
            context: .

        working_dir: /var/www/html

        volumes:
          - .:/var/www/html

        expose:
            - "9000"

        depends_on:
            - mysql
            - redis
    redis:
        image: redis:7
        ports:
                - "6379:6379"

    nginx:
        image: nginx:latest
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

        depends_on:
            - app

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: adminforge
            MYSQL_ROOT_PASSWORD: admin
        volumes:
          - mysql_data:/var/lib/mysql





volumes:
        mysql_data:
